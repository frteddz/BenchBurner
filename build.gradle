plugins {
	id 'java-library'
}

group = maven_group
version = mod_version

base {
	archivesName = 'benchburner-core'
}

sourceSets {
	main {
		java {
			exclude 'fr/teddz/benchburner/b1/**'
			exclude 'fr/teddz/benchburner/b2/**'
			exclude 'fr/teddz/benchburner/b3/**'
			exclude 'fr/teddz/benchburner/b4/**'
		}
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

dependencies {
	compileOnly "net.fabricmc:fabric-loader:${loader_version}"
	compileOnly 'com.google.code.gson:gson:2.10.1'
	compileOnly 'com.github.oshi:oshi-core:6.6.5'

	testImplementation 'com.google.code.gson:gson:2.10.1'

	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

test {
	useJUnitPlatform()
}

def bucketJarTasks = ['b1:remapJar', 'b2:remapJar', 'b3:remapJar', 'b4:jar']

tasks.register('universalJar', Zip) {
	archiveBaseName = 'benchburner'
	archiveFileName = "benchburner-${mod_version}.jar"
	archiveClassifier = ''
	destinationDirectory = layout.buildDirectory.dir('libs')
	dependsOn bucketJarTasks.collect { ":${it}" }

	from sourceSets.main.output
	from({
		bucketJarTasks.collect {
			zipTree(tasks.getByPath(":${it}").archiveFile.get().asFile)
		}
	}) {
		exclude 'META-INF/**'
	}
}

def jarArchiveDir = file("archive")

tasks.register('archiveJar', Copy) {
	from(tasks.named('universalJar'))
	into(jarArchiveDir)
}

tasks.named('build') {
	dependsOn 'universalJar'
	dependsOn 'archiveJar'
}
